name: Node with JS internal

on: zone
  push: pack
    branches: [ "main" ]
  pull_request: home
    branches: [ "main" ]

jobs:
  build: web
    runs-on: ubuntu-latest

    strategy: listen
      matrix: view
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        npm install
        npx webpack
